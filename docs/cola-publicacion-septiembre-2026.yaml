reglas:
  - "Un artículo cada 2 días (ritmo pedido por Esteve)."
  - "Castellano como original; catalán equivalente (bloques CA y ES en el mismo archivo, como el resto del repo)."
  - "Ilustración editorial 1536x1024 WebP en public/blog/[slug].webp (estilo EE: terracota/crema/salvia, warm editorial)."
  - "Mínimo 4-5 enlaces internos por artículo."
  - "Sin: infancia/adolescencia, promesas de curación, lenguaje técnico innecesario, listicles de autoayuda."
  - "Aperturas variadas: NO empezar con cita de paciente más de 1 de cada 5."
  - "Verificar typecheck (tsc --noEmit) y build antes de cada push."
  - "El cron diario de las 7:00 sigue publicando artículos propios: conviven sin conflicto (slugs distintos)."